name: Build and publish release
on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
permissions:
  contents: write
jobs:
  version:
    name: Validate branch, version and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Determine release version
        id: version
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: python3 scripts/release.py version
  checks:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  build:
    name: Build signed APKs
    needs: [version, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/android-setup
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for key in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing signing secret: $key"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
      - name: Build release APKs
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ needs.version.outputs.version_code }}
          VERSION_NAME: ${{ needs.version.outputs.version_name }}
        run: >-
          ./gradlew :app:assembleFossRelease --build-cache --no-daemon --stacktrace
          -PABI_SPLITS=true -PciBuild
          -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
      - name: Verify signatures and prepare release assets
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          VERSION_NAME: ${{ needs.version.outputs.version_name }}
          VERSION_CODE: ${{ needs.version.outputs.version_code }}
        run: python3 scripts/release.py assets
      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-assets-${{ needs.version.outputs.tag }}
          path: release-assets/
          retention-days: 90
          if-no-files-found: error
  publish:
    name: Publish ${{ inputs.channel }} release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ needs.version.outputs.tag }}
          path: artifacts/
      - name: Create release tag
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "$RELEASE_TAG"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Gallery ${{ needs.version.outputs.tag }}
          body_path: artifacts/release-notes.md
          files: |
            artifacts/*.apk
            artifacts/checksums-sha256.txt
            artifacts/release-metadata.json
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: false
          prerelease: ${{ inputs.channel == 'beta' }}
          make_latest: ${{ inputs.channel == 'stable' && 'true' || 'false' }}
